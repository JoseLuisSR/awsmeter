plugins {
    id 'java'
    id 'jacoco'
}

group 'org.apache.jmeter.protocol.aws'
version '4.1.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility= JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

class ApacheJMeterRule implements ComponentMetadataRule{
    void execute(ComponentMetadataContext context) {
        context.details.allVariants{
            withDependencies{
                removeAll {it.group in ["org.apache.jmeter","bom"] }
            }
        }
    }
}

dependencies {
    components{
        withModule("org.apache.jmeter:ApacheJMeter_java", ApacheJMeterRule)
        withModule("org.apache.jmeter:ApacheJMeter_core", ApacheJMeterRule)
    }
    implementation 'org.apache.jmeter:ApacheJMeter_java:5.6.2'
    compileOnly 'org.apache.jmeter:ApacheJMeter_core:5.6.2'
    implementation platform('software.amazon.awssdk:bom:2.21.43')
    implementation platform('com.amazonaws:aws-java-sdk-bom:1.12.610')
    implementation 'software.amazon.awssdk:kinesis'
    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:cognitoidentityprovider'
    implementation 'software.amazon.awssdk:eventbridge'
    implementation 'com.amazonaws:aws-java-sdk-sns'
    implementation 'com.amazonaws:aws-java-sdk-sts'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    testImplementation 'org.apache.jmeter:ApacheJMeter_java:5.6.2'
    testImplementation 'org.apache.jmeter:ApacheJMeter_core:5.6.2'
    // Add additional JMeter dependencies needed for complete testing - use complete classnames
    testImplementation('org.apache.jmeter:jorphan:5.6.2') {
        // Remove the component metadata rule for this dependency
        exclude group: 'org.apache.jmeter'
    }
    testImplementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    testImplementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.20.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.5.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
    useJUnitPlatform()
    
    // Configure JVM args for Java 24 compatibility with Mockito/Byte Buddy
    jvmArgs '-Dnet.bytebuddy.experimental=true'
    
    // Configure test logging
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        showCauses true
        showStackTraces true
        exceptionFormat "full"
    }
    
    // Ensure tests run even if no changes detected
    outputs.upToDateWhen { false }
    
    // Enable Jacoco test coverage
    finalizedBy jacocoTestReport
}

// Configure Jacoco test report generation
jacocoTestReport {
    dependsOn test
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    finalizedBy jacocoTestCoverageVerification
}

// Configure Jacoco coverage verification with 95% threshold
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95 // 95% overall coverage requirement
            }
        }
        
        rule {
            enabled = true
            element = 'CLASS'
            
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.75 // Allow 75% minimum for individual classes to handle edge cases
            }
            
            excludes = [
                '*.test.*',
                '**/*Test*',
                '**/*TestCase*'
            ]
        }
    }
}

// Custom task to run only unit tests with detailed output
task unitTest(type: Test) {
    description = 'Runs unit tests with detailed output'
    group = 'verification'
    
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showExceptions true
        showCauses true
        showStackTraces true
        exceptionFormat "full"
        displayGranularity 2
    }
    
    // Force tests to run
    outputs.upToDateWhen { false }
    
    // Include only unit tests
    include '**/*Test.class'
    
    // Generate reports
    reports {
        html.required = true
        junitXml.required = true
    }
    
    // Enable Jacoco coverage for unit tests
    finalizedBy jacocoTestReport
}

// Custom Jacoco report task for unit tests
task unitTestCoverageReport(type: JacocoReport) {
    dependsOn unitTest
    
    executionData unitTest
    sourceSets sourceSets.main
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Custom coverage verification for unit tests
task unitTestCoverageVerification(type: JacocoCoverageVerification) {
    dependsOn unitTestCoverageReport
    
    executionData unitTest
    sourceSets sourceSets.main
    
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95 // 95% coverage requirement for CI/CD
            }
        }
        
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50 // 50% minimum coverage for individual classes
            }
        }
    }
}

// Combined task for CI/CD - runs tests and validates coverage
task ciTest {
    description = 'Runs unit tests and validates 95% coverage for CI/CD'
    group = 'verification'
    dependsOn unitTest, unitTestCoverageVerification
}

// Task to clean and run tests
task cleanTest {
    description = 'Clean and run all tests'
    group = 'verification'
    dependsOn clean, test
}

task uberJar(type: Jar) {

    duplicatesStrategy = 'include'

    from sourceSets.main.output

    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}